<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pan Piotr Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 15px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* PRZYCISK OPINII - umieszczony pod rankingiem po lewej stronie */
        .feedback-btn {
            position: absolute;
            top: 195px;
            left: 15px;
            background: #ffcc00;
            color: #1a1a1a;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            z-index: 25;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* OKIENKO OPINII (MODAL) */
        #feedback-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 96;
            justify-content: center;
            align-items: center;
        }

        .feedback-box {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #ffcc00;
            width: 320px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        .feedback-box h3 { color: #ffcc00; margin-top: 0; }
        .feedback-box textarea {
            width: 90%;
            height: 60px;
            background: #111;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            resize: none;
            margin-bottom: 10px;
        }

        .feedback-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        .feedback-item {
            background: #333;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .feedback-item b { color: #00ffcc; }
        .feedback-item span { color: #aaa; font-size: 10px; float: right; }

        .footer-disclaimer {
            position: absolute; bottom: 10px; right: 15px; font-size: 12px;
            color: rgba(255, 255, 255, 0.7); background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px; border-radius: 8px; z-index: 25;
        }
        .footer-disclaimer a { color: #00ffcc; text-decoration: none; }
    </style>
</head>
<body>

    <!-- PRZYCISK I OKIENKO OPINII -->
    <button class="feedback-btn" onclick="openFeedbackModal()">💬 OPINIE (<span id="feedback-count">0</span>)</button>

    <div id="feedback-modal">
        <div class="feedback-box">
            <span class="close-code" onclick="closeFeedbackModal()" style="cursor:pointer; position:absolute; right:12px; top:8px; font-size:20px; color:#fff;">&times;</span>
            <h3>Napisz opinię o grze</h3>
            <textarea id="feedback-text" placeholder="Wpisz co myślisz o grze..." maxlength="150"></textarea>
            <button onclick="sendFeedback()" style="background:#00ffcc; color:#111; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer;">Wyślij opinię</button>
            
            <h4 style="margin: 15px 0 5px 0; color: #fff;">Publiczne opinie:</h4>
            <div class="feedback-list" id="feedback-list">
                <p style="color:#888; text-align:center;">Ładowanie opinii...</p>
            </div>
        </div>
    </div>

    <!-- TUTAJ ZNAJDUJE SIĘ RESZTA TWOJEJ GRY / ELEMENTÓW BODY -->

    <!-- Biblioteki Firebase (wersja kompatybilna v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      // Twoja skonfigurowana baza Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyDPd1grXMdHysx2oApr-oPyv-LL5kgWPIE",
        authDomain: "pan-piotr-clicker-opinie.firebaseapp.com",
        databaseURL: "https://pan-piotr-clicker-opinie-default-rtdb.firebaseio.com",
        projectId: "pan-piotr-clicker-opinie",
        storageBucket: "pan-piotr-clicker-opinie.firebasestorage.app",
        messagingSenderId: "299267672814",
        appId: "1:299267672814:web:1d24ddc412754def9e81ff"
      };
      
      // Inicjalizacja Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      function openFeedbackModal() {
          document.getElementById('feedback-modal').style.display = 'flex';
      }

      function closeFeedbackModal() {
          document.getElementById('feedback-modal').style.display = 'none';
      }

      // WYSYŁANIE OPINII DO BAZY
      function sendFeedback() {
          const text = document.getElementById('feedback-text').value.trim();
          if (!text) {
              alert("Napisz coś przed wysłaniem!");
              return;
          }
          
          const nick = (typeof playerName !== 'undefined' && playerName) ? playerName : 'Gracz';

          db.ref('opinie').push({
              nick: nick,
              tekst: text,
              data: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString().slice(0,5)
          });

          document.getElementById('feedback-text').value = '';
          alert("Dzięki za opinię!");
      }

      // POBIERANIE OPINII NA ŻYWO I ODŚWIEŻANIE LICZNIKA
      db.ref('opinie').on('value', (snapshot) => {
          const data = snapshot.val();
          const listEl = document.getElementById('feedback-list');
          const countEl = document.getElementById('feedback-count');
          if (!listEl) return;
          
          listEl.innerHTML = '';

          if (!data) {
              listEl.innerHTML = '<p style="color:#888; text-align:center;">Brak opinii. Bądź pierwszy!</p>';
              if (countEl) countEl.innerText = 0;
              return;
          }

          const entries = Object.values(data).reverse();
          if (countEl) countEl.innerText = entries.length;

          entries.forEach(item => {
              const div = document.createElement('div');
              div.className = 'feedback-item';
              div.innerHTML = `<b>${item.nick}</b> <span>${item.data}</span><br>${item.tekst}`;
              listEl.appendChild(div);
          });
      });
    </script>

</body>
</html>

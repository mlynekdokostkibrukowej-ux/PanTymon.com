<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona Pana Piotra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 30px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #score-board {
            font-size: 26px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 10px;
            position: relative;
            z-index: 20;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Nieruchomy obrazek do klikania (obraz.png) */
        .click-img {
            width: 160px;
            height: auto;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px #ff0055;
            position: relative;
            z-index: 20;
            transition: transform 0.1s ease;
            margin-top: 20px;
        }

        .click-img:active {
            transform: scale(0.93);
        }

        /* Latające obrazki DVD (obrazek.png) */
        .dvd-img {
            position: absolute;
            width: 140px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 5;
        }

        .moving-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff0055;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            transition: top 0.1s ease, left 0.1s ease;
        }

        .instruction, h1 {
            position: relative;
            z-index: 20;
            margin: 5px 0;
        }
        .instruction { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Witaj na mojej stronie!</h1>
    <div id="score-board">Punkty: <span id="score">0</span></div>
    <p class="instruction">Kliknij w ekran, aby włączyć muzykę! Klikaj w poniższy obrazek, by zbierać punkty!</p>

    <!-- Plik muzyczny -->
    <audio id="bgAudio" loop preload="auto" src="muzyka.mp3"></audio>

    <!-- NIERUCHOMY OBRAZEK DO KLIKANIA -->
    <div>
        <img class="click-img" id="targetImg" src="obraz.png" alt="Kliknij mnie!" onclick="addPoint()">
    </div>

    <!-- LATAJĄCE OBRAZKI W TLE -->
    <img class="dvd-img" src="obrazek.png" alt="Latające tło">
    <img class="dvd-img" src="obrazek.png" alt="Latające tło">

    <!-- UCIEKAJĄCY PRZYCISK -->
    <button class="moving-btn" id="btn" onmouseover="moveButton()" onclick="alert('Złapałeś mnie!')">Złap mnie!</button>

    <script>
        const audio = document.getElementById('bgAudio');
        
        document.addEventListener('click', () => {
            audio.play().catch(error => console.log("Błąd audio:", error));
        }, { once: true });

        let score = 0;
        function addPoint() {
            score++;
            document.getElementById('score').innerText = score;
        }

        function moveButton() {
            const btn = document.getElementById('btn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        const dvdImages = document.querySelectorAll('.dvd-img');
        const dvdObjects = [];

        dvdImages.forEach((img) => {
            dvdObjects.push({
                element: img,
                x: Math.random() * (window.innerWidth - 150),
                y: Math.random() * (window.innerHeight - 150),
                dx: (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2),
                dy: (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2)
            });
        });

        function animateDVD() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            dvdObjects.forEach(obj => {
                const imgWidth = obj.element.clientWidth || 140;
                const imgHeight = obj.element.clientHeight || 140;

                obj.x += obj.dx;
                obj.y += obj.dy;

                if (obj.x + imgWidth >= screenWidth || obj.x <= 0) obj.dx *= -1;
                if (obj.y + imgHeight >= screenHeight || obj.y <= 0) obj.dy *= -1;

                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });

            requestAnimationFrame(animateDVD);
        }

        animateDVD();
    </script>

</body>
</html>

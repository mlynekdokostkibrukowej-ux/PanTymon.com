<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona Pana Piotra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 20px;
            margin: 0;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease;
        }

        /* Panel ze statystykami */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 20;
            margin-bottom: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #score-board { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        #cps-board { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        #max-cps-board { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }

        /* Nieruchomy obrazek do klikania (obraz.png) */
        .click-img {
            width: 160px;
            height: auto;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px #ff0055;
            position: relative;
            z-index: 20;
            transition: transform 0.05s ease;
            margin-top: 15px;
        }

        .click-img:active {
            transform: scale(0.9);
        }

        /* Styl dla wyleciatujących miniaturek (obrazeczek.jpg) */
        .particle {
            position: absolute;
            width: 40px;
            height: auto;
            pointer-events: none;
            z-index: 30;
            border-radius: 5px;
        }

        /* Latające obrazki DVD (obrazek.png) */
        .dvd-img {
            position: absolute;
            width: 140px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 5;
        }

        .moving-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff0055;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            transition: top 0.1s ease, left 0.1s ease;
        }

        .instruction, h1 {
            position: relative;
            z-index: 20;
            margin: 5px 0;
        }
        .instruction { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Witaj na mojej stronie!</h1>
    
    <!-- STATYSTYKI -->
    <div class="stats-container">
        <div class="stat-box" id="score-board">Punkty: <span id="score">0</span></div>
        <div class="stat-box" id="cps-board">CPS: <span id="cps">0.0</span></div>
        <div class="stat-box" id="max-cps-board">MAX CPS: <span id="max-cps">0.0</span></div>
    </div>

    <p class="instruction">Kliknij w ekran, aby włączyć muzykę! Naklikaj jak najszybciej!</p>

    <!-- Plik muzyczny -->
    <audio id="bgAudio" loop preload="auto" src="muzyka.mp3"></audio>

    <!-- NIERUCHOMY OBRAZEK DO KLIKANIA -->
    <div>
        <img class="click-img" id="targetImg" src="obraz.png" alt="Kliknij mnie!" onclick="addPointAndChangeColor(event)">
    </div>

    <!-- LATAJĄCE OBRAZKI W TLE -->
    <img class="dvd-img" src="obrazek.png" alt="Latające tło">
    <img class="dvd-img" src="obrazek.png" alt="Latające tło">

    <!-- UCIEKAJĄCY PRZYCISK -->
    <button class="moving-btn" id="btn" onmouseover="moveButton()" onclick="alert('Złapałeś mnie!')">Złap mnie!</button>

    <script>
        const audio = document.getElementById('bgAudio');
        
        document.addEventListener('click', () => {
            audio.play().catch(error => console.log("Błąd audio:", error));
        }, { once: true });

        let score = 0;
        let clickTimestamps = [];
        let maxCps = 0;

        function addPointAndChangeColor(event) {
            score++;
            document.getElementById('score').innerText = score;

            const now = Date.now();
            clickTimestamps.push(now);

            // Zmiana koloru tła
            const randomColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
            document.body.style.backgroundColor = randomColor;

            // Tworzenie wybuchu obrazeczek.jpg
            createParticles(event.clientX, event.clientY);
        }

        // Efekt wybuchu małych obrazków
        function createParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('img');
                
                // Zmieniono rozszerzenie na .jpg
                particle.src = 'obrazeczek.jpg'; 
                
                particle.classList.add('particle');
                
                particle.style.left = (x - 20) + 'px';
                particle.style.top = (y - 20) + 'px';

                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 100;
                const destX = (Math.cos(angle) * speed);
                const destY = (Math.sin(angle) * speed);

                particle.animate([
                    { transform: 'translate(0px, 0px) scale(1) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0.2) rotate(360deg)`, opacity: 0 }
                ], {
                    duration: 800,
                    easing: 'cubic-bezier(0,0,0.2,1)'
                });

                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        // Pętla CPS
        setInterval(() => {
            const now = Date.now();
            clickTimestamps = clickTimestamps.filter(timestamp => now - timestamp <= 1000);
            
            const currentCps = clickTimestamps.length;
            document.getElementById('cps').innerText = currentCps;

            if (currentCps > maxCps) {
                maxCps = currentCps;
                document.getElementById('max-cps').innerText = maxCps;
            }
        }, 100);

        function moveButton() {
            const btn = document.getElementById('btn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        const dvdImages = document.querySelectorAll('.dvd-img');
        const dvdObjects = [];

        dvdImages.forEach((img) => {
            dvdObjects.push({
                element: img,
                x: Math.random() * (window.innerWidth - 150),
                y: Math.random() * (window.innerHeight - 150),
                dx: (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2),
                dy: (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2)
            });
        });

        function animateDVD() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            dvdObjects.forEach(obj => {
                const imgWidth = obj.element.clientWidth || 140;
                const imgHeight = obj.element.clientHeight || 140;

                obj.x += obj.dx;
                obj.y += obj.dy;

                if (obj.x + imgWidth >= screenWidth || obj.x <= 0) obj.dx *= -1;
                if (obj.y + imgHeight >= screenHeight || obj.y <= 0) obj.dy *= -1;

                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });

            requestAnimationFrame(animateDVD);
        }

        animateDVD();
    </script>

</body>
</html>

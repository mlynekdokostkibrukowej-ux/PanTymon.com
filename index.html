<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona Pana Piotra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 50px;
            overflow: hidden;
        }

        /* Styl obrazka */
        .ptoszek-img {
            width: 250px;
            border-radius: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .ptoszek-img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px #00ffcc;
        }

        /* Styl uciekającego przycisku */
        .moving-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff0055;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: top 0.2s ease, left 0.2s ease;
        }

        .instruction {
            margin-bottom: 25px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>Witaj na mojej stronie!</h1>
    <p class="instruction">Kliknij w obrazek lub w dowolne miejsce, aby włączyć dźwięk!</p>

    <!-- Odtwarzacz audio z muzyką z serwera -->
    <audio id="bgAudio" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Obrazek -->
    <img class="ptoszek-img" src="https://picsum.photos/300" alt="Zdjęcie" onclick="playAudio()">

    <br><br><br>

    <!-- Uciekający przycisk -->
    <button class="moving-btn" id="btn" onmouseover="moveButton()" onclick="alert('Złapałeś mnie!')">Złap mnie!</button>

    <script>
        const audio = document.getElementById('bgAudio');

        function playAudio() {
            audio.play().catch(err => console.log("Błąd odtwarzania:", err));
        }

        // Włącza muzykę po pierwszym kliknięciu w dowolne miejsce na stronie
        document.body.addEventListener('click', function() {
            playAudio();
        }, { once: true });

        // Uciekanie przycisku
        function moveButton() {
            const btn = document.getElementById('btn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>

</body>
</html>

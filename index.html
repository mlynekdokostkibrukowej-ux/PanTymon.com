<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona Pana Piotra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 50px;
            margin: 0;
            overflow: hidden;
        }

        /* Latające obrazki DVD */
        .dvd-img {
            position: absolute;
            width: 150px;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            user-select: none;
        }

        /* Uciekający przycisk */
        .moving-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff0055;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            transition: top 0.1s ease, left 0.1s ease;
        }

        .instruction, h1 {
            position: relative;
            z-index: 10;
        }
        .instruction { color: #aaa; }
    </style>
</head>
<body>

    <h1>Witaj na mojej stronie!</h1>
    <p class="instruction">Kliknij gdziekolwiek w ekran, aby włączyć muzykę!</p>

    <!-- Plik muzyczny (jeśli na GitHubie nazywa się inaczej, zmień tutaj) -->
    <audio id="bgAudio" loop preload="auto" src="muzyka.mp3"></audio>

    <!-- 
      TUTAJ JEST PLIK OBRAZKA: 
      Jeśli Twój plik na GitHubie to np. obrazek.jpg albo fotka.png, 
      zmień poniżej "obrazek.png" na dokładną nazwę swojego pliku!
    -->
    <img class="dvd-img" src="obrazek.png" alt="Pan Piotr">
    <img class="dvd-img" src="obrazek.png" alt="Pan Piotr 2">

    <!-- Uciekający przycisk -->
    <button class="moving-btn" id="btn" onmouseover="moveButton()" onclick="alert('Złapałeś mnie!')">Złap mnie!</button>

    <script>
        const audio = document.getElementById('bgAudio');

        // Uruchomienie dźwięku po kliknięciu
        document.addEventListener('click', () => {
            audio.play().catch(error => {
                console.log("Błąd odtwarzania audio:", error);
            });
        }, { once: true });

        // Uciekanie przycisku
        function moveButton() {
            const btn = document.getElementById('btn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        // Animacja obrazków DVD
        const images = document.querySelectorAll('.dvd-img');
        const dvdObjects = [];

        images.forEach((img) => {
            dvdObjects.push({
                element: img,
                x: Math.random() * (window.innerWidth - 150),
                y: Math.random() * (window.innerHeight - 150),
                dx: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2),
                dy: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2)
            });
        });

        function animateDVD() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            dvdObjects.forEach(obj => {
                const imgWidth = obj.element.clientWidth || 150;
                const imgHeight = obj.element.clientHeight || 150;

                obj.x += obj.dx;
                obj.y += obj.dy;

                if (obj.x + imgWidth >= screenWidth || obj.x <= 0) obj.dx *= -1;
                if (obj.y + imgHeight >= screenHeight || obj.y <= 0) obj.dy *= -1;

                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });

            requestAnimationFrame(animateDVD);
        }

        animateDVD();
    </script>

</body>
</html>

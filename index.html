<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pan Piotr Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 15px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* PRZYCISK OPINII - obniżony, żeby nie nachodził na ranking */
        .feedback-btn {
            position: absolute;
            top: 135px;
            left: 15px;
            background: #ffcc00;
            color: #1a1a1a;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            z-index: 25;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* OKIENKO OPINII (MODAL) */
        #feedback-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 96;
            justify-content: center;
            align-items: center;
        }

        .feedback-box {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #ffcc00;
            width: 320px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        .feedback-box h3 { color: #ffcc00; margin-top: 0; }
        .feedback-box textarea {
            width: 90%;
            height: 60px;
            background: #111;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px;
            resize: none;
            margin-bottom: 10px;
        }

        .feedback-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        .feedback-item {
            background: #333;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .feedback-item b { color: #00ffcc; }
        .feedback-item span { color: #aaa; font-size: 10px; float: right; }

        /* Style interfejsu gry */
        .ranking-box {
            position: absolute; top: 15px; left: 15px; background: #222;
            border: 2px solid #ffcc00; padding: 10px; border-radius: 10px;
            width: 200px; text-align: left; z-index: 25;
        }
        .score-box {
            font-size: 20px; font-weight: bold; background: #111;
            padding: 10px 20px; border-radius: 10px; display: inline-block;
            border: 2px solid #00ffcc; margin: 0 5px;
        }
        .clicker-img {
            width: 140px; height: 140px; border-radius: 50%;
            cursor: pointer; position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); border: 3px solid #ff0055;
            box-shadow: 0 0 20px #ff0055; object-fit: cover; z-index: 10;
        }
        .dvd-obj {
            position: absolute; width: 140px; height: 140px;
            object-fit: cover; border-radius: 10px; z-index: 5;
        }
    </style>
</head>
<body>

    <!-- RANKING I WYNIKI -->
    <div class="ranking-box">
        <h4 style="margin:0 0 5px 0; color:#ffcc00;">🏆 Ranking Top 5</h4>
        <div id="ranking-list">1. Gracz: 0 pkt</div>
        <button onclick="changeNick()" style="margin-top:8px; background:#ff0055; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">Zmień Nick</button>
    </div>

    <!-- PRZYCISK OPINII -->
    <button class="feedback-btn" onclick="openFeedbackModal()">💬 OPINIE (<span id="feedback-count">0</span>)</button>

    <!-- OKIENKO OPINII -->
    <div id="feedback-modal">
        <div class="feedback-box">
            <span class="close-code" onclick="closeFeedbackModal()" style="cursor:pointer; position:absolute; right:12px; top:8px; font-size:20px; color:#fff;">&times;</span>
            <h3>Napisz opinię o grze</h3>
            <textarea id="feedback-text" placeholder="Wpisz co myślisz o grze..." maxlength="150"></textarea>
            <button onclick="sendFeedback()" style="background:#00ffcc; color:#111; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer;">Wyślij opinię</button>
            
            <h4 style="margin: 15px 0 5px 0; color: #fff;">Publiczne opinie:</h4>
            <div class="feedback-list" id="feedback-list">
                <p style="color:#888; text-align:center;">Ładowanie opinii...</p>
            </div>
        </div>
    </div>

    <div>
        <div class="score-box">Punkty: <span id="score">0</span></div>
        <div class="score-box">CPS: <span id="cps">0</span></div>
    </div>

    <!-- GŁÓWNY KLIKACZ -->
    <img src="kinger.jpg" class="clicker-img" id="clicker" onclick="clickAction()">

    <!-- RUCHOME OBIEKTY TŁA (DVD) -->
    <img src="obrazekzek.jpg" class="dvd-obj" id="dvd1">
    <img src="obrazek.png" class="dvd-obj" id="dvd2">

    <!-- Skrypty gry -->
    <script>
        let score = 0;
        let playerName = localStorage.getItem('panPiotrNick') || 'Gracz';
        
        function clickAction() {
            score++;
            document.getElementById('score').innerText = score;
        }

        function changeNick() {
            let newNick = prompt("Podaj swój nick:", playerName);
            if (newNick) {
                playerName = newNick;
                localStorage.setItem('panPiotrNick', playerName);
                document.getElementById('ranking-list').innerText = `1. ${playerName}: ${score} pkt`;
            }
        }

        // Animacja DVD w tle
        const dvdObjects = [
            { element: document.getElementById('dvd1'), x: 100, y: 100, dx: 2, dy: 2 },
            { element: document.getElementById('dvd2'), x: 300, y: 200, dx: -2, dy: 1.5 }
        ];

        function animateDVD() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            dvdObjects.forEach(obj => {
                obj.x += obj.dx;
                obj.y += obj.dy;

                if (obj.x + 140 >= screenWidth || obj.x <= 0) obj.dx *= -1;
                if (obj.y + 140 >= screenHeight || obj.y <= 0) obj.dy *= -1;

                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });

            requestAnimationFrame(animateDVD);
        }
        animateDVD();
    </script>

    <!-- Biblioteki Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDPd1grXMdHysx2oApr-oPyv-LL5kgWPIE",
        authDomain: "pan-piotr-clicker-opinie.firebaseapp.com",
        databaseURL: "https://pan-piotr-clicker-opinie-default-rtdb.firebaseio.com",
        projectId: "pan-piotr-clicker-opinie",
        storageBucket: "pan-piotr-clicker-opinie.firebasestorage.app",
        messagingSenderId: "299267672814",
        appId: "1:299267672814:web:1d24ddc412754def9e81ff"
      };
      
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      function openFeedbackModal() {
          document.getElementById('feedback-modal').style.display = 'flex';
      }

      function closeFeedbackModal() {
          document.getElementById('feedback-modal').style.display = 'none';
      }

      function sendFeedback() {
          const text = document.getElementById('feedback-text').value.trim();
          if (!text) {
              alert("Napisz coś przed wysłaniem!");
              return;
          }
          
          db.ref('opinie').push({
              nick: playerName,
              tekst: text,
              data: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString().slice(0,5)
          });

          document.getElementById('feedback-text').value = '';
          alert("Dzięki za opinię!");
      }

      db.ref('opinie').on('value', (snapshot) => {
          const data = snapshot.val();
          const listEl = document.getElementById('feedback-list');
          const countEl = document.getElementById('feedback-count');
          if (!listEl) return;
          
          listEl.innerHTML = '';

          if (!data) {
              listEl.innerHTML = '<p style="color:#888; text-align:center;">Brak opinii. Bądź pierwszy!</p>';
              if (countEl) countEl.innerText = 0;
              return;
          }

          const entries = Object.values(data).reverse();
          if (countEl) countEl.innerText = entries.length;

          entries.forEach(item => {
              const div = document.createElement('div');
              div.className = 'feedback-item';
              div.innerHTML = `<b>${item.nick}</b> <span>${item.data}</span><br>${item.tekst}`;
              listEl.appendChild(div);
          });
      });
    </script>

</body>
</html>

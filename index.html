<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona Pana Piotra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            padding-top: 50px;
            margin: 0;
            overflow: hidden; /* Ukrywa paski przewijania */
        }

        /* Latające obrazki DVD */
        .dvd-img {
            position: absolute;
            width: 120px;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            user-select: none;
        }

        /* Uciekający przycisk */
        .moving-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff0055;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            transition: top 0.1s ease, left 0.1s ease;
        }

        .instruction {
            color: #aaa;
            position: relative;
            z-index: 10;
        }

        h1 {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Witaj na mojej stronie!</h1>
    <p class="instruction">Kliknij w ekran, aby włączyć muzykę!</p>

    <!-- Muzyka w tle -->
    <audio id="bgAudio" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Tutaj dodajesz swoje obrazki (możesz dopisać kolejne) -->
    <img class="dvd-img" src="https://picsum.photos/150?random=1" alt="DVD 1">
    <img class="dvd-img" src="https://picsum.photos/150?random=2" alt="DVD 2">
    <img class="dvd-img" src="https://picsum.photos/150?random=3" alt="DVD 3">

    <!-- Uciekający przycisk -->
    <button class="moving-btn" id="btn" onmouseover="moveButton()" onclick="alert('Złapałeś mnie!')">Złap mnie!</button>

    <script>
        // Odtwarzanie dźwięku po kliknięciu
        const audio = document.getElementById('bgAudio');
        document.body.addEventListener('click', () => {
            audio.play().catch(e => console.log(e));
        }, { once: true });

        // Uciekanie przycisku
        function moveButton() {
            const btn = document.getElementById('btn');
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        // ANIMACJA LOGO DVD
        const images = document.querySelectorAll('.dvd-img');
        const dvdObjects = [];

        // Inicjalizacja pozycji i prędkości dla każdego obrazka
        images.forEach((img, index) => {
            dvdObjects.push({
                element: img,
                x: Math.random() * (window.innerWidth - 150),
                y: Math.random() * (window.innerHeight - 150),
                dx: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2), // Prędkość X
                dy: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2)  // Prędkość Y
            });
        });

        function animateDVD() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            dvdObjects.forEach(obj => {
                const imgWidth = obj.element.clientWidth || 120;
                const imgHeight = obj.element.clientHeight || 120;

                // Aktualizacja pozycji
                obj.x += obj.dx;
                obj.y += obj.dy;

                // Odbicie od lewej/prawej krawędzi
                if (obj.x + imgWidth >= screenWidth || obj.x <= 0) {
                    obj.dx *= -1;
                }

                // Odbicie od górnej/dolnej krawędzi
                if (obj.y + imgHeight >= screenHeight || obj.y <= 0) {
                    obj.dy *= -1;
                }

                // Przypisanie nowej pozycji na ekranie
                obj.element.style.left = obj.x + 'px';
                obj.element.style.top = obj.y + 'px';
            });

            requestAnimationFrame(animateDVD);
        }

        // Uruchomienie animacji DVD
        animateDVD();
    </script>

</body>
</html>
